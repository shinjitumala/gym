[package]
name = "gym"
version = "0.2.0"
edition = "2021"

[dependencies]
chrono = "0.4.38"
fpr-cli = "0.2.6"
fpr-cli-derives = "0.2.2"
inquire = "0.7.5"
itertools = "0.13.0"
regex = "1.11.1"
serde = "1.0.215"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.41.1", features = ["full"] }
toml = "1.1.2"

[[test]]
name = "cli"
path = "test/cli.rs"

[[test]]
name = "import"
path = "test/import.rs"

[[test]]
name = "store"
path = "test/store.rs"

[dev-dependencies]
tokio = { version = "1.41.1", features = ["full"] }
